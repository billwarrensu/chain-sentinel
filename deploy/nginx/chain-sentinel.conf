# 链上哨兵 —— Nginx 反向代理示例
#
# 部署步骤：
#   1) 把本文件放到 /etc/nginx/sites-available/chain-sentinel.conf
#      并软链到 /etc/nginx/sites-enabled/：
#        sudo ln -s /etc/nginx/sites-available/chain-sentinel.conf /etc/nginx/sites-enabled/
#   2) 把 server_name 改成你的真实域名（域名 A 记录先解析到本机）。
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) 一键申请 HTTPS 证书（自动改写本配置为 443）：
#        sudo certbot --nginx -d your-domain.com
#
# 上游 Node 服务（docker-compose 绑定在 127.0.0.1:5000；裸机 pm2 同理）。
upstream chain_sentinel_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # TODO: 替换为真实域名

    # 申请证书时 certbot 需要的挑战路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://chain_sentinel_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 链上查询会串行调用多个外部接口，适当放大超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
    }
}

