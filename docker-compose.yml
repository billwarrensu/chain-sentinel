services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: chain-sentinel:latest
    container_name: chain-sentinel
    restart: unless-stopped
    ports:
      # 仅绑定本机回环，由同机 Nginx 反向代理到 80/443，避免 Node 端口直接暴露公网
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOSTNAME: "0.0.0.0"
      # 可选：在同目录 .env 中设置 TRONGRID_API_KEY 以提高公共节点限额
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
